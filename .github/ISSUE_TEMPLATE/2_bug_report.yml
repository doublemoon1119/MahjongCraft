name: Library, API or build bug report / 函式庫、API 或建置錯誤回報
description: Report a problem in the mahjong library, the extension API, the build or the documentation. / 回報麻將函式庫、擴充 API、建置或文件的問題
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For problems in the Minecraft mod, use the Minecraft mod bug report. Please search existing issues first. For questions, use [Discussions](https://github.com/doublemoon1119/MahjongCraft/discussions).
        Minecraft 模組的問題請改用 Minecraft 模組錯誤回報。請先搜尋是否已有相同的 issue。一般提問請到 [Discussions](https://github.com/doublemoon1119/MahjongCraft/discussions)
  - type: dropdown
    id: area
    attributes:
      label: Area / 問題所在
      options:
        - Mahjong library (rules, game flow, AI) / 麻將函式庫（規則、流程、AI）
        - Extension API / 擴充 API
        - Build or documentation / 建置或文件
        - Other / 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: The version you use, or the commit if you built it yourself. / 使用的版本；自行建置時請填 commit
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened / 發生了什麼
      description: Describe the problem and what you expected instead. / 描述問題，以及原本預期的結果
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 重現步驟
      description: Include the code, commands or configuration involved. / 請附上相關的程式碼、指令或設定
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Logs, error output or screenshots / 記錄檔、錯誤訊息或截圖
      description: |
        Drag files here, or paste the output. Include the full stack trace if there is one.
        可以直接拖曳檔案到這裡，或貼上輸出內容。有錯誤堆疊時請附上完整內容
