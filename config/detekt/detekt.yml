# MahjongCraft detekt configuration, run manually with `./gradlew detektAll`.
# The build reads this file with buildUponDefaultConfig = false: only rules explicitly enabled here run.
# To enable another rule, add it under its rule set with active: true.

config:
  validation: true

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  # Tests clean up in finally at the end of the test, where cancellation cannot cut the cleanup short.
  SuspendFunInFinallySection:
    active: true
    excludes: &testSources ['**/src/test/**', '**/src/*Test/**']
  # A catch of CancellationException has to rethrow it before doing anything else. Tests catch exceptions to
  # assert on them.
  SuspendFunSwallowedCancellation:
    active: true
    excludes: *testSources
  # Test helpers take TestScope as their receiver to drive virtual time.
  SuspendFunWithCoroutineScopeReceiver:
    active: true
    excludes: *testSources
  SuspendFunWithFlowReturnType:
    active: true

exceptions:
  active: true
  ErrorUsageWithThrowable:
    active: true
  ExceptionRaisedInUnexpectedLocation:
    active: true
  InstanceOfCheckForException:
    active: true
  NotImplementedDeclaration:
    active: true
  ObjectExtendsThrowable:
    active: true
  PrintStackTrace:
    active: true
  RethrowCaughtException:
    active: true
  ReturnFromFinally:
    active: true
  SwallowedException:
    active: true
  ThrowingExceptionFromFinally:
    active: true
  ThrowingExceptionInMain:
    active: true
  ThrowingNewInstanceOfSameException:
    active: true
  TooGenericExceptionThrown:
    active: true

potential-bugs:
  active: true
  AvoidReferentialEquality:
    active: true
  CastNullableToNonNullableType:
    active: true
  CastToNullableType:
    active: true
  CharArrayToStringCall:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  EqualsWithHashCodeExist:
    active: true
  ExitOutsideMain:
    active: true
  ExplicitGarbageCollectionCall:
    active: true
  HasPlatformType:
    active: true
  IgnoredReturnValue:
    active: true
  ImplicitDefaultLocale:
    active: true
  InvalidRange:
    active: true
  IteratorHasNextCallsNextMethod:
    active: true
  IteratorNotThrowingNoSuchElementException:
    active: true
  MapGetWithNotNullAssertionOperator:
    active: true
  MissingPackageDeclaration:
    active: true
  MissingSuperCall:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  UnnecessaryNotNullCheck:
    active: true
  UnnecessaryNotNullOperator:
    active: true
  UnnecessarySafeCall:
    active: true
  UnreachableCatchBlock:
    active: true
  UnreachableCode:
    active: true
  UnsafeCast:
    active: true
  UnusedUnaryOperator:
    active: true
  UselessPostfixExpression:
    active: true
  WrongEqualsTypeParameter:
    active: true

mahjongcraft:
  active: true
  KDocOpeningLine:
    active: true
  KDocTagSpacing:
    active: true
  # Arguments of calls that span several lines must be named.
  MultilineCallArgumentName:
    active: true

style:
  active: true
  # Fully qualified names that an import and the simple name can replace.
  UnnecessaryFullyQualifiedName:
    active: true
  # Unused private declarations, which the Kotlin compiler does not warn about.
  UnusedPrivateClass:
    active: true
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true
