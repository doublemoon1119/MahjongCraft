# Shared Gradle daemon defaults for this multi-module build.
# These values are upper limits, not memory reserved at startup.
# Override them in the Gradle user home or CI environment when the
# available memory requires smaller limits or permits larger limits.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Build independent subprojects in parallel.
# Memory-constrained environments can use --no-parallel and reduce org.gradle.workers.max.
org.gradle.parallel=true
