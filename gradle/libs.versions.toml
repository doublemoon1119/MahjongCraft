[versions]

# MahjongCraft release trains
# 各可發布模組的獨立版本；root project 與 testing modules 固定使用 0.0.0-dev。
minecraft-mod-version = "0.4.0-SNAPSHOT"
logic-version = "0.4.0-SNAPSHOT"
flow-version = "0.4.0-SNAPSHOT"
ai-version = "0.4.0-SNAPSHOT"
extension-api-version = "0.4.0-SNAPSHOT"

# MahjongCraft core JVM policy
# toolchain 是執行編譯器與測試的 JDK；release 是產出 bytecode 的最低 Java 版本。
# Minecraft version-specific modules 改由 gradle/platform-targets.toml 指定 Java policy。
core-java-toolchain = "17"
core-java-release = "17"

# Kotlin ecosystem
kotlin = "2.4.0"
coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.7.1-0.6.x-compat"
ktoml = "0.7.1"

# Dependency injection and build tooling
koin-bom = "4.2.2"
koin-plugin = "1.0.1"
ktlint-gradle = "14.2.0"

# Minecraft v1.20.1 + Fabric target dependencies
# 版本號帶數字結尾的 key 刻意不用 dash 分段（例如 minecraft1201 而非 minecraft-v1-20-1），
# 避免 Gradle version catalog 的巢狀 accessor 在數字開頭區段產生不穩定的名稱。
fabric-loom = "1.17.19"
minecraft1201 = "1.20.1"
yarnMappings1201 = "1.20.1+build.10"
fabric-loader = "0.19.3"
fabricApi1201 = "0.92.11+1.20.1"
fabric-language-kotlin = "1.13.12+kotlin.2.4.0"

[libraries]

# Build-logic implementation dependencies
# 只供 included build 編譯 convention plugins，不會打包進 MahjongCraft runtime。
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ktlint-gradle-plugin = { group = "org.jlleitschuh.gradle", name = "ktlint-gradle", version.ref = "ktlint-gradle" }

# Kotlin ecosystem libraries
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
ktoml-core = { group = "com.akuleshov7", name = "ktoml-core", version.ref = "ktoml" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }

# Dependency injection libraries
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-annotations = { module = "io.insert-koin:koin-annotations" }

# Minecraft v1.20.1 + Fabric target libraries
minecraft1201 = { group = "com.mojang", name = "minecraft", version.ref = "minecraft1201" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabricApi1201 = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabricApi1201" }
fabric-language-kotlin = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "fabric-language-kotlin" }

[plugins]

# MahjongCraft convention plugins
# 由 build-logic included build 提供，因此不宣告外部版本。
mahjongcraft-base = { id = "mahjongcraft.base" }
mahjongcraft-kotlin-multiplatform = { id = "mahjongcraft.kotlin-multiplatform" }
mahjongcraft-minecraft-version-common = { id = "mahjongcraft.minecraft-version-common" }
mahjongcraft-minecraft-loader = { id = "mahjongcraft.minecraft-loader" }
mahjongcraft-target-management = { id = "mahjongcraft.target-management" }

# Kotlin and general build plugins
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
koin-compiler = { id = "io.insert-koin.compiler.plugin", version.ref = "koin-plugin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }

# Minecraft loader plugins
fabric-loom = { id = "fabric-loom", version.ref = "fabric-loom" }
