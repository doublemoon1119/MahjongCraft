schema-version = 1

[[targets]]
id = "minecraft-v1.20.1-fabric"
platform = "minecraft"
java-toolchain = 17
java-release = 17
modules = [
    "platform/minecraft/common",
    "platform/minecraft/common-debug",
    "platform/minecraft/v1.20.1/mod",
    "platform/minecraft/v1.20.1/mod-debug",
    "platform/minecraft/v1.20.1/fabric",
    "platform/minecraft/v1.20.1/fabric-debug",
]
example-modules = [
    "example/mahjong-extension",
    "example/platform/minecraft/common",
    "example/platform/minecraft/v1.20.1/mod",
    "example/platform/minecraft/v1.20.1/fabric",
]

[targets.attributes]
minecraft-version = "v1.20.1"
loader = "fabric"

# Fabric Language Kotlin 1.13.14 在執行時提供、mod 不附帶的版本。
[targets.provided-versions]
kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"

[[targets]]
id = "minecraft-v1.20.1-forge"
platform = "minecraft"
java-toolchain = 17
java-release = 17
modules = [
    "platform/minecraft/common",
    "platform/minecraft/v1.20.1/mod",
    "platform/minecraft/v1.20.1/forge",
]

[targets.attributes]
minecraft-version = "v1.20.1"
loader = "forge"

# Kotlin for Forge 4.13.0 在執行時提供、mod 不附帶的版本。
[targets.provided-versions]
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.13.0"
