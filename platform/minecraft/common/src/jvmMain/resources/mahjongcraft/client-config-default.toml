# MahjongCraft client configuration.
# This file only affects your own local client and is never sent to a server.
#
# Configuration location:
# <Minecraft instance>/config/mahjongcraft/client.toml
#
# You can also toggle this setting in-game with:
#   /mahjongcraft_client label toggle
# The command updates this value and writes it straight back to this line, keeping the rest of
# this file (including these comments) unchanged.

# Show a small corner label (a digit or letter) on each mahjong tile face, to help players who
# don't read Chinese identify tiles at a glance (for example, a nine dot tile shows "9").
tile-labels-enabled = false

# Automatically keep your own hand tiles sorted after every draw/discard/call, instead of leaving
# them in the order you picked them up. Toggle in-game with:
#   /mahjongcraft_client hand_sort toggle
# Unlike the label toggle above, this preference is also sent to the server: your hand tiles are
# shared entities positioned by the server, so sorting them has to happen there.
auto-sort-hand-enabled = true

# HUD positions are ratios inside the area where the complete HUD can fit on screen.
# 0.0 means the left/top edge and 1.0 means the right/bottom edge.
[hud-layout]
decision-panel-y = 0.88
compact-prompt-x = 0.5
compact-prompt-y = 0.9
discard-analysis-y = 0.86
