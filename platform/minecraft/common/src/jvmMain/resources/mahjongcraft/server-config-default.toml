# MahjongCraft server configuration.
# Run `/mahjongcraft config reload` after editing this file. A server restart is not required.
#
# Configuration location:
# - Singleplayer: <world save>/serverconfig/mahjongcraft.toml
# - Dedicated server: <server directory>/config/mahjongcraft/server.toml
#
# Singleplayer worlds use separate configuration files.
# Dedicated servers keep this configuration across world changes.

[player-disconnection]

# Controls what happens to a player's seat after disconnecting from a game that has not started.
# Available values:
# - "keep_seat": Keep the seat and wait for the player to reconnect.
# - "leave_immediately": Remove the player from the waiting game immediately.
# - "leave_after_timeout": Keep the seat until the timeout expires; reconnecting cancels the removal.
# Games that have already started always keep the disconnected player's seat for now.
policy = "leave_immediately"

# Time in seconds before removing a disconnected player when policy is "leave_after_timeout".
# This value is ignored by the other policies.
# Allowed range: 1 to 3600 (1 hour).
timeout-seconds = 30

[table]

# Controls what happens when a player attempts to break a mahjong table.
# Available values:
# - "deny_while_occupied": Deny breaking while a waiting game or active game uses the table.
# - "allow_waiting_room_only": Allow breaking and dissolve a waiting game, but deny active games.
# - "allow_and_terminate": Allow breaking and remove the related waiting or active game without settlement.
break-policy = "deny_while_occupied"

# Controls cleanup when a loaded chunk does not contain the expected table block entity or table UUID.
# Available values:
# - "keep_and_warn": Keep the game and location index, and write a warning to the server log.
# - "remove_waiting_room": Remove a waiting game but preserve an active game.
# - "remove_all": Remove the related waiting or active game and its location index.
orphaned-policy = "remove_all"

[mahjong-tile]

# Controls whether mahjong tile entities physically block players and other non-tile entities.
# Mahjong tiles never physically collide with other mahjong tiles.
# Raycasting, right-click interaction, rendering, saving, and HUD targeting remain available when disabled.
physical-collision-enabled = true

[history]

# Controls whether completed matches are archived to the local history database. Disabling stops active recording permanently;
# re-enabling records only new matches.
enabled = true

# Controls whether matches containing any AI seat are archived.
include-ai-matches = true

# Keep interrupted or partial records only after they can no longer resume.
# A normal shutdown with a resumable game is not an interruption. Disabling recording creates a partial record.
include-interrupted-matches = false

# Controls whether players and administrators may query archived history. Disabling does not stop recording.
query-enabled = true

# Controls whether operators may query all archived matches. Operators may still query their own matches when disabled.
allow-admin-query = true

# Minimum interval between accepted history queries from the same player, in milliseconds.
# Allowed range: 50 to 10000. This cannot be set to 0 to disable query protection.
query-minimum-interval-ms = 250

# Maximum accepted history-query jobs awaiting completion of their replies across the whole server.
# This is not the number of concurrent SQLite queries; database management remains serialized.
# Allowed range: 1 to 64. This cannot be set to 0 to disable query protection.
# Lowering the limit on reload does not cancel queries already accepted.
query-max-outstanding = 32

# Minimum interval between admission rejection replies (rate limit or full workload) to the same player, in milliseconds.
# Responses from already accepted jobs are not throttled by this setting.
# Allowed range: 250 to 10000. This cannot be set to 0 to disable query protection.
query-rejection-reply-interval-ms = 1000

# Maximum ended matches to retain. A new completed match is saved before the oldest ended matches are removed.
# 0 means unlimited matches. Active matches are protected and do not count toward this limit.
max-matches = 100

# Ended matches expire this many days after their end time in UTC, even when max-matches has not been reached.
# 0 disables age-based cleanup. Interrupted records use the confirmed interruption time.
retention-days = 90

# Maximum actual disk space for the database and its WAL/SHM files, in MiB (1 MiB = 1,048,576 bytes).
# Must be positive; 0 is invalid. All configured limits apply independently.
# If only protected active data remains above the limit, stop appending history and mark a gap; gameplay continues.
max-disk-mib = 256
