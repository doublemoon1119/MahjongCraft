modLoader = "kotlinforforge"
loaderVersion = "${dependencyRequirements.kotlinForForge}"
license = "${license}"
issueTrackerURL = "${issues}"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
displayURL = "${homepage}"
logoFile = "assets/${id}/icon.png"
authors = "${author}"
description = """${description}"""

[[mixins]]
config = "mahjongcraft.neoforge.mixins.json"

[[mixins]]
config = "mahjongcraft.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "${dependencyRequirements.neoforge}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${dependencyRequirements.minecraft}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "kotlinforforge"
type = "required"
versionRange = "${dependencyRequirements.kotlinForForge}"
ordering = "NONE"
side = "BOTH"
